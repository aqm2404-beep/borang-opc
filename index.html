/* ===== MeterCheck v1.4 visual refresh ===== */
:root{
  --red:#c8102e;
  --red-dark:#9f0b24;
  --navy:#11213a;
  --ink:#172033;
  --muted:#667085;
  --line:#e1e6ee;
  --bg:#f3f5f8;
  --soft:#f8fafc;
}
body{
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.shell{
  max-width:760px;
  background:#fff;
  box-shadow:0 8px 40px rgba(16,24,40,.07);
}
.topbar{
  min-height:70px;
  padding:11px 18px;
  gap:12px;
  border-bottom:1px solid #edf0f4;
  box-shadow:none;
}
.topbar > img{display:none!important}
.brandmark{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:12px;
  overflow:hidden;
  position:relative;
  background:#fff;
}
.brandmark img{
  position:absolute;
  width:156px!important;
  height:auto!important;
  max-width:none!important;
  left:-7px;
  top:-7px;
}
.title{
  color:var(--navy);
  font-size:18px;
  line-height:1.05;
  letter-spacing:-.25px;
  font-weight:800;
}
.sub{
  margin-top:4px;
  font-size:11px;
  letter-spacing:.6px;
  font-weight:700;
  color:#7a8495;
}
.homebtn{
  width:38px;
  height:38px;
  border-radius:12px;
  padding:0;
  display:grid;
  place-items:center;
  font-size:20px;
  color:var(--navy);
}
.homePage{
  padding:22px 18px 26px;
}
.homeIntro{
  padding:5px 2px 18px;
}
.eyebrow{
  display:block;
  color:var(--red);
  font-size:10px;
  font-weight:850;
  letter-spacing:1.35px;
  margin-bottom:8px;
}
.homeIntro h1{
  margin:0;
  color:var(--navy);
  font-size:29px;
  line-height:1.08;
  letter-spacing:-.8px;
}
.homeIntro p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:13px;
}
.inspectionGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.inspectionCard{
  width:100%;
  min-height:178px;
  text-align:left;
  border:1px solid var(--line);
  background:#fff;
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  box-shadow:0 5px 16px rgba(16,24,40,.035);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.inspectionCard:active{
  transform:scale(.985);
}
.inspectionCard:hover{
  border-color:#cfd6e2;
  box-shadow:0 10px 25px rgba(16,24,40,.07);
}
.inspectionTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:27px;
}
.inspectionCode{
  display:inline-flex;
  min-width:47px;
  justify-content:center;
  border-radius:999px;
  background:#fcebef;
  color:var(--red);
  font-size:11px;
  font-weight:900;
  letter-spacing:.7px;
  padding:6px 10px;
}
.inspectionArrow{
  font-size:20px;
  color:#8a94a5;
}
.inspectionCard h2{
  margin:0 0 4px;
  color:var(--navy);
  font-size:19px;
  letter-spacing:-.35px;
}
.inspectionCard p{
  margin:0 0 11px;
  color:#4c586b;
  font-size:12px;
  font-weight:650;
}
.inspectionCard small{
  color:#8a94a5;
  font-size:10.5px;
}
.homeSection{
  margin-top:22px;
}
.homeSectionHead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:8px;
  padding:0 2px;
}
.homeSectionHead span{
  color:var(--navy);
  font-size:13px;
  font-weight:850;
}
.homeSectionHead small{
  color:#98a2b3;
  font-size:10.5px;
}
.draftList{
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
}
.draftRow{
  width:100%;
  border:0;
  background:#fff;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 13px;
  text-align:left;
}
.draftRow + .draftRow{
  border-top:1px solid #edf0f4;
}
.miniCode{
  width:38px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:#f6f7f9;
  color:var(--red);
  font-size:10px;
  font-weight:900;
}
.draftText{
  flex:1;
  min-width:0;
}
.draftText b{
  display:block;
  color:var(--navy);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.draftText small{
  display:block;
  color:#98a2b3;
  font-size:10px;
  margin-top:2px;
}
.arrow{
  color:#98a2b3;
  font-size:22px;
  line-height:1;
}
.profileRow{
  margin-top:18px;
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fbfcfd;
  text-align:left;
}
.profileIcon{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:#eef1f5;
  color:#445067;
}
.profileRow > span:nth-child(2){
  flex:1;
}
.profileRow b{
  display:block;
  color:var(--navy);
  font-size:12px;
}
.profileRow small{
  display:block;
  color:#8b95a5;
  font-size:10px;
  margin-top:2px;
}
.backupAlert{
  margin:0 0 12px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border:1px solid #f0d397;
  background:#fffaf0;
  border-radius:13px;
}
.backupAlert > div{
  flex:1;
}
.backupAlert b{
  display:block;
  font-size:11px;
  color:#7a5210;
}
.backupAlert small{
  color:#9a722d;
  font-size:10px;
}
.retryBtn{
  border:0;
  background:#fff;
  border-radius:8px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
  color:#7a5210;
}
.appFoot{
  padding-top:17px;
  text-align:center;
  color:#b0b7c3;
  font-size:9px;
  letter-spacing:.45px;
}
.hero{display:none!important}

@media(max-width:560px){
  .topbar{
    min-height:64px;
    padding:9px 13px;
  }
  .brandmark{
    width:43px;
    height:43px;
    flex-basis:43px;
  }
  .brandmark img{
    width:140px!important;
    left:-6px;
    top:-6px;
  }
  .title{font-size:17px}
  .homePage{padding:18px 13px 24px}
  .homeIntro{padding-bottom:15px}
  .homeIntro h1{font-size:26px}
  .inspectionGrid{grid-template-columns:1fr}
  .inspectionCard{
    min-height:150px;
    padding:16px;
  }
  .inspectionTop{margin-bottom:20px}
  .inspectionCard h2{font-size:18px}
}

/* ===== MeterCheck v1.19 enterprise hardening ===== */
:root{
  --mc-red:#e10600;
  --mc-red-dark:#b90400;
  --mc-navy:#0b2d5b;
  --mc-ink:#17263a;
  --mc-muted:#627287;
  --mc-line:#dce3eb;
  --mc-soft:#f6f8fb;
  --mc-ok:#168447;
  --mc-warn:#b96b00;
  --mc-bad:#c52a24;

.progress-label{font-size:11px!important;line-height:1.15}

.field small{font-size:11.5px!important}
.item{
  border:0!important;border-radius:0!important;margin:0!important;padding:13px 2px!important;
  border-bottom:1px solid #e8edf2!important;box-shadow:none!important

.item:last-child{border-bottom:0!important}

.inspectionCard{background:#fff!important;min-height:142px!important}
.inspectionCard.lpc,.inspectionCard.opc{background:#fff!important}

.inspectionCard.opc{border-left:4px solid #e10600!important}
.inspectionCard h2{margin-top:18px!important}
.card-action{display:flex;align-items:center;gap:5px;margin-top:13px;font-size:11.5px;font-weight:700;color:#315b88}
.opc .card-action{color:#b42318}
.card-go{display:none!important}
.progress-step.can-go{cursor:pointer}

.review-row.editable{cursor:pointer}

.review-edit{font-size:10.5px;font-weight:700;color:#2462a0;margin-left:6px}
.review-status.warn{color:#9a5b00!important;background:#fff6df!important}

.gps-accuracy{font-weight:600}
.sigbox{position:relative;padding-top:26px!important}
.signature-hint{position:absolute;top:8px;left:12px;font-size:11px;color:#8591a1;font-weight:600;pointer-events:none}
.signature-line{position:absolute;left:14%;right:14%;bottom:47px;border-top:1px solid #cad2dc;pointer-events:none}
.sig-recorded{font-size:11px;color:#168447;font-weight:650;margin-top:7px;min-height:16px}
.modal-backdrop{
  position:fixed;inset:0;background:rgba(12,25,42,.46);display:grid;place-items:end center;
  z-index:999;padding:18px
}
.modal-card{
  width:min(440px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px #0004;
  animation:mcModalIn .16s ease-out
}
@keyframes mcModalIn{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.modal-card h3{margin:0 0 7px;font-size:18px;color:var(--mc-navy)}

.connection-state.offline{background:#fff3e3;color:#9a5b00}
.offline-banner{
  margin-bottom:12px;padding:10px 11px;border:1px solid #f1d092;background:#fff9ec;border-radius:10px;
  font-size:11.5px;color:#805400;display:flex;gap:8px;align-items:center
}
.completion .save-row small{font-size:11px!important}
@media(max-width:680px){
  .photos{grid-template-columns:1fr!important}

}
@media(max-width:560px){
  .progress-label{font-size:10.5px!important}
  .itemtitle{font-size:13px!important}
  .itemdesc{font-size:11.8px!important}
  .pill{font-size:12px!important}
  .homePage{padding-top:14px!important}
}

function ico(name,size=18){const p={home:'<path d="M3 10.5 10 4l7 6.5V18a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1z"/>',back:'<path d="m12.5 5-6 6 6 6"/>',next:'<path d="m8 5 6 6-6 6"/>',camera:'<path d="M4 7h3l1.2-2h5.6L15 7h3v10H4z"/><circle cx="11" cy="12" r="3"/>',location:'<path d="M11 19s5-4.7 5-10a5 5 0 0 0-10 0c0 5.3 5 10 5 10z"/><circle cx="11" cy="9" r="1.8"/>',settings:'<circle cx="11" cy="11" r="3"/><path d="M11 2.5v2M11 17.5v2M2.5 11h2M17.5 11h2M4.9 4.9l1.4 1.4M15.7 15.7l1.4 1.4M17.1 4.9l-1.4 1.4M6.3 15.7l-1.4 1.4"/>',trash:'<path d="M5 7h12M9 7V5h4v2M7 7l1 11h6l1-11M10 10v5M13 10v5"/>',check:'<path d="m5 11 3.5 3.5L17 6"/>',edit:'<path d="m5 16 1-4 8-8 3 3-8 8-4 1z"/>',share:'<path d="M8 11h8M13 7l4 4-4 4"/><path d="M17 11v6H5V5h6"/>',file:'<path d="M6 3h7l4 4v12H6z"/><path d="M13 3v5h5M8.5 12h6M8.5 15h5"/>',user:'<circle cx="11" cy="8" r="3"/><path d="M5 19c.7-3.2 2.7-5 6-5s5.3 1.8 6 5"/>',plus:'<path d="M11 5v12M5 11h12"/>',download:'<path d="M11 3v10M7 9l4 4 4-4M5 18h12"/>',retry:'<path d="M17 8a6 6 0 1 0 .3 5M17 4v4h-4"/>',close:'<path d="M6 6l10 10M16 6 6 16"/>',phone:'<path d="M7 3h8v16H7zM10 16h2"/>',drive:'<path d="M8 4h6l4 7-3 5H7l-3-5z"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.file}</svg>`;}

function safeGet(k){try{return window.localStorage?localStorage.getItem(k):null;}catch(e){return null;}}
function safeSet(k,v){try{if(window.localStorage)localStorage.setItem(k,v);return true;}catch(e){return false;}}
function safeRemove(k){try{if(window.localStorage)localStorage.removeItem(k);}catch(e){}}
function loadJSON(k,d){try{let v=safeGet(k);return v?JSON.parse(v):JSON.parse(JSON.stringify(d));}catch(e){return JSON.parse(JSON.stringify(d));}}
function saveJSON(k,v){safeSet(k,JSON.stringify(v));}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200);}

function closeModal(value){
  const m=document.getElementById("mcModal");
  if(!m)return;
  const resolve=m.__resolve;
  m.remove();
  if(resolve)resolve(value);
}
function appDialog(title,message,opts={}){
  return new Promise(resolve=>{
    const old=document.getElementById("mcModal");if(old)old.remove();
    const wrap=document.createElement("div");wrap.id="mcModal";wrap.className="modal-backdrop";wrap.__resolve=resolve;
    const danger=opts.danger?" bad":"";
    wrap.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(message)}</p>${opts.html||""}
      <div class="modal-actions">${opts.cancel===false?"":`<button class="btn ghost" id="mcCancel">${esc(opts.cancelText||"Batal")}</button>`}<button class="btn primary${danger}" id="mcOk">${esc(opts.okText||"OK")}</button></div></div>`;
    document.body.appendChild(wrap);
    const ok=wrap.querySelector("#mcOk"),cancel=wrap.querySelector("#mcCancel");
    ok.onclick=()=>closeModal(true);if(cancel)cancel.onclick=()=>closeModal(false);
  });
}
function appNotice(title,message,okText="OK"){return appDialog(title,message,{cancel:false,okText});}
function appConfirm(title,message,okText="Teruskan",cancelText="Batal"){return appDialog(title,message,{okText,cancelText});}
function gpsInputDialog(){
  return new Promise(resolve=>{
    const old=document.getElementById("mcModal");if(old)old.remove();
    const wrap=document.createElement("div");wrap.id="mcModal";wrap.className="modal-backdrop";wrap.__resolve=resolve;
    wrap.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true">
      <h3>Masukkan koordinat</h3>
      <p>Masukkan Latitud dan Longitud dalam satu kotak.<br>Contoh: 3.139000, 101.686900</p>
      <div class="field"><label>Koordinat GPS</label><input id="mcCoords" inputmode="decimal" placeholder="3.139000, 101.686900"></div>
      <div class="modal-actions"><button class="btn ghost" id="mcCancel">Batal</button><button class="btn primary" id="mcOk">Simpan lokasi</button></div>
    </div>`;
    document.body.appendChild(wrap);
    wrap.querySelector("#mcCancel").onclick=()=>{wrap.remove();resolve(null)};
    wrap.querySelector("#mcOk").onclick=()=>{
      const raw=(wrap.querySelector("#mcCoords").value||'').trim();
      const parts=raw.split(/[,\s]+/).filter(Boolean);
      const lat=Number(parts[0]),lng=Number(parts[1]);
      if(parts.length<2||!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180){
        wrap.querySelector(".modal-card p").textContent="Koordinat tidak sah. Gunakan format: 3.139000, 101.686900";
        return;
      }
      wrap.remove();resolve({lat,lng});
    };
  });
}

function today(){let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day;}
function ymd(d=today()){return d.replace(/-/g,"");}
function nextRef(type,date=today()){let key="ctr_"+type+"_"+profile.staffId+"_"+ymd(date),n=parseInt(safeGet(key)||"0")+1;return type+"-"+profile.staffId+"-"+ymd(date)+"-"+String(n).padStart(3,"0");}
function commitRef(type,date){let key="ctr_"+type+"_"+profile.staffId+"_"+ymd(date),n=parseInt(safeGet(key)||"0")+1;safeSet(key,String(n));}
function newState(type){let common={type,ref:nextRef(type),date:today(),gps:null,photos:[],remarks:"",tnbSig:null,contractorSig:null,contractorName:"",contractorPhone:"",useStamp:true};if(type==="LPC")return Object.assign(common,{staffId:profile.staffId,station:profile.station,stationCode:profile.stationCode,supplierBill:"",tariff:"",voltage:profile.voltage,userName:"",address:"",cts:[{mode:"std",value:""}],rows:LPC_ITEMS.map(()=>({status:"",note:""}))});return Object.assign(common,{projectNo:"",project:"",meterType:"1PH",md:"",userType:"",inspection:"1",siteAddress:"",rows:OPC_ITEMS.map(()=>({status:"",note:""})),result:""});}
function draftKey(){return formType?"draft_"+formType:null;}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(state&&formType) idbSet(draftKey(),state);},250);}

const LOGIN_SESSION_KEY='metercheck_login_ok';
const LOGIN_HASH='';

async function sha256Hex(text){
  const data=new TextEncoder().encode(text);
  const digest=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isLoggedIn(){
  return sessionStorage.getItem(LOGIN_SESSION_KEY)==='1';
}

function showLogin(){
  navToken++;
  formType=null;
  state=null;
  app.innerHTML=`<div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <img src="tnb_logo.png" alt="Tenaga Nasional">
        <div><div class="login-title">MeterCheck</div><div class="login-sub">LPC · OPC</div></div>
      </div>
      <h1>Log masuk</h1>
      <p class="login-help">Masukkan kata laluan untuk membuka aplikasi.</p>
      <input id="loginPass" class="login-password" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="Kata laluan">
      <div id="loginError" class="login-error"></div>
      <button class="btn primary login-button" onclick="submitLogin()">Log masuk</button>
    </div>
  </div>`;
  const input=document.getElementById('loginPass');
  setTimeout(()=>input&&input.focus(),80);
  input&&input.addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin();});
}

async function submitLogin(){
  const input=document.getElementById('loginPass');
  const err=document.getElementById('loginError');
  if(!input)return;
  const value=(input.value||'').trim();
  if(!value){
    if(err)err.textContent='Masukkan kata laluan.';
    return;
  }
  const hash=await sha256Hex(value);
  if(hash!==LOGIN_HASH){
    if(err)err.textContent='Kata laluan tidak betul.';
    input.value='';
    input.focus();
    return;
  }
  sessionStorage.setItem(LOGIN_SESSION_KEY,'1');
  showHome();
}

function logoutApp(){
  sessionStorage.removeItem(LOGIN_SESSION_KEY);
  formType=null;state=null;step=0;
  showLogin();
}

function bootApp(){
  showHome();
}

async function showHome(){
  const token=++navToken;
  state=null;formType=null;step=0;
  renderHome(null,null,null);
  try{
    const results=await Promise.all([idbGet("draft_LPC"),idbGet("draft_OPC")]);results.push(null);
    if(token!==navToken)return;
    renderHome(results[0],results[1],results[2]);
  }catch(e){ console.warn("Storage unavailable; app continues without draft restore.",e); }
}
function profileReady(){return !!(String(profile.name||'').trim()&&String(profile.staffId||'').trim());}
async function startForm(type){
  if(!profileReady()){await appNotice('Profil belum lengkap','Isi Nama dan No. pekerja dalam Profil dahulu. Maklumat ini digunakan pada PDF.');showProfile();return;}
  const token=++navToken;
  let old=await idbGet("draft_"+type);
  if(token!==navToken)return;
  if(old&&!(await appConfirm("Ganti draft?","Draft sedia ada akan diganti dengan pemeriksaan baharu.","Ganti draft")))return;
  formType=type;state=newState(type);step=0;renderForm();
  await idbSet(draftKey(),state);
}
async function resumeForm(type){
  const token=++navToken;
  formType=type;
  let saved=await idbGet("draft_"+type);
  if(token!==navToken)return;
  state=saved||newState(type);step=0;renderForm();
}
async function deleteDraft(type){
  const ok=await appConfirm(
    'Padam draft?',
    'Draft '+type+' ini akan dipadam dan tidak boleh dipulihkan.',
    'Padam',
    'Batal'
  );
  if(!ok)return;
  await idbDel('draft_'+type);
  toast('Draft '+type+' dipadam');
  showHome();
}
function renderForm(){
  const labels=['Maklumat','Senarai Semak','Gambar','Semakan'];
  const title=formType==='LPC'?'LPC · Kesediaan Tapak':'OPC · Pemeriksaan Jangka';
  const prog=labels.map((x,i)=>`<div class="progress-step ${i<step?'done':''} ${i===step?'active':''} ${i<step?'can-go':''}" ${i<step?`onclick="goStep(${i})"`:''}><div class="progress-dot">${i<step?ico('check',14):i+1}</div><div class="progress-label">${x}</div></div>`).join('');
  app.innerHTML=`<div class="shell">${appHeader(title,state.ref)}<div class="page"><div class="progress">${prog}</div><div id="stepbody"></div></div><div class="footerbar">${step>0?`<button class="btn ghost" onclick="prevStep()">${ico('back',17)} Sebelum</button>`:''}${step<3?`<button class="btn primary" onclick="nextStep()">Seterusnya ${ico('next',17)}</button>`:''}</div></div>`;
  renderStep();
}
function renderStep(){let b=$("#stepbody");if(step===0)b.innerHTML=formType==="LPC"?renderLpcDetails():renderOpcDetails();if(step===1)b.innerHTML=renderChecklist();if(step===2)b.innerHTML=renderEvidence();if(step===3){b.innerHTML=renderReview();setTimeout(initSignaturePads,50);}bindCommon();}
function bindCommon(){document.querySelectorAll("[data-bind]").forEach(el=>{let k=el.dataset.bind;el.value=(state[k]==null?"":state[k]);el.addEventListener("input",()=>{state[k]=el.value;if(k==="date")state.ref=nextRef(formType,el.value);scheduleSave();});el.addEventListener("change",()=>{state[k]=el.value;scheduleSave();});});}

    <div class="field"><label>Tarikh</label><input type="date" data-bind="date"></div>
    <div class="field"><label>Nama stesen</label><input data-bind="station"></div>
    <div class="field"><label>Kod stesen</label><input data-bind="stationCode"></div>
    <div class="field"><label>Voltan</label><input data-bind="voltage"></div>
    <div class="field"><label>Bil. pembekal</label><input data-bind="supplierBill"></div>

  <section class="sectionblock"><div class="sectiontitle">Maklumat pengguna</div>
    <div class="field"><label>Nama pengguna</label><input data-bind="userName"></div>
    <div class="field"><label>Alamat pengguna</label><textarea data-bind="address"></textarea></div>

  ${renderGps()}`;}
function ctRow(c,i){let opts=['<option value="">Pilih nisbah</option>',...CT_STD.map(x=>`<option value="${x}" ${c.mode==='std'&&c.value===x?'selected':''}>${x}</option>`),`<option value="MANUAL" ${c.mode==='manual'?'selected':''}>Manual</option>`].join('');return `<div class="ctrow ${c.mode==='manual'?'manual':''}"><div class="ct-label">CT ${i+1}</div><div class="ct-main"><select onchange="setCtMode(${i},this.value)">${opts}</select>${c.mode==='manual'?`<input placeholder="Contoh 1600/5" value="${esc(c.value||'')}" oninput="setCtManual(${i},this.value)">`:''}</div><button class="deletebtn" onclick="removeCt(${i})" aria-label="Buang CT">${ico('trash',16)}</button></div>`;}
function setCtMode(i,v){if(v==='MANUAL')state.cts[i]={mode:'manual',value:''};else state.cts[i]={mode:'std',value:v};scheduleSave();renderStep();}
function setCtManual(i,v){state.cts[i].value=v;scheduleSave();}
function addCt(){state.cts.push({mode:'std',value:''});scheduleSave();renderStep();}
function removeCt(i){if(state.cts.length===1)state.cts[0]={mode:'std',value:''};else state.cts.splice(i,1);scheduleSave();renderStep();}

function renderOpcDetails(){return `

function renderGps(){let g=state.gps;let cls='empty',acc='';if(g){cls=(g.acc&&g.acc>25)?'warn':'ok';acc=g.acc?`Ketepatan ±${Math.round(g.acc)} m`:'Koordinat manual';}
return `<section class="sectionblock"><div class="sectiontitle">Lokasi GPS</div><div class="gpscard"><div class="gpsstate ${cls}"><div class="status-icon">${ico('location',18)}</div><div class="gpscopy">${g?`<b>${cls==='warn'?'Lokasi dikesan · ketepatan rendah':'Lokasi dikesan'}</b><span>${g.lat.toFixed(6)}, ${g.lng.toFixed(6)}</span><small>${acc}</small>`:`<b>Lokasi belum direkodkan</b><span>Dapatkan lokasi GPS sebelum pengesahan.</span>`}</div></div><div class="actions"><button class="btn secondary" onclick="captureGps()">${ico('location',17)} ${g?'Ambil semula':'Dapatkan lokasi'}</button><button class="btn ghost" onclick="manualGps()">${ico('edit',16)} Manual</button></div></div></section>`;}
function captureGps(){
  if(!navigator.geolocation){
    appNotice('GPS tidak tersedia','Peranti atau browser ini tidak menyediakan GPS. Gunakan koordinat manual.');
    return;
  }
  toast('Mencari lokasi...');
  navigator.geolocation.getCurrentPosition(
    p=>{
      state.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,time:new Date().toLocaleString('ms-MY')};
      scheduleSave();renderStep();
    },
    e=>appNotice('GPS gagal',e.message+'\n\nGunakan koordinat manual jika perlu.'),
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}
async function manualGps(){
  const v=await gpsInputDialog();
  if(!v)return;
  state.gps={lat:v.lat,lng:v.lng,acc:0,time:new Date().toLocaleString('ms-MY')+' (manual)'};
  scheduleSave();renderStep();
}

function renderChecklist(){let items=formType==='LPC'?LPC_ITEMS:OPC_ITEMS,done=state.rows.filter(r=>r.status).length;return `<h1 class="page-title">Senarai Semak</h1><p class="page-lead">Lengkapkan semua item sebelum teruskan.</p><div class="checklist-head"><div class="sectiontitle" style="margin:0">${formType==='LPC'?'Kesediaan Tapak':'Pemeriksaan OPC'}</div><span class="countbadge">${done}/${items.length} selesai</span></div>${items.map((it,i)=>renderItem(it,i)).join('')}`;}

function toggleRowNote(i){rowNoteOpen[i]=!rowNoteOpen[i];renderStep();}

function computeOpcResult(){if(formType!=='OPC')return '';let rows=state.rows||[];if(!rows.length||rows.some(r=>!r.status))return '';return rows.some(r=>r.status==='GAGAL')?'GAGAL':'LULUS';}

async function addPhotos(files){for(let f of [...files]){let data=await compressImage(f,1400,.75);state.photos.push({data,note:'',related:''});}scheduleSave();renderStep();}
function compressImage(file,max,q){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let w=im.width,h=im.height,s=Math.min(1,max/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q));};im.onerror=reject;im.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}

async function nextStep(){
  if(step===1){
    let missing=state.rows.map((r,i)=>r.status?null:i+1).filter(Boolean);
    if(missing.length){await appNotice('Senarai Semak belum lengkap','Item belum dijawab: '+missing.join(', '));return;}
    if(formType==='OPC')state.result=computeOpcResult();
  }
  step++;renderForm();
}
function prevStep(){step=Math.max(0,step-1);renderForm();}
function goStep(i){if(i>=0&&i<step){step=i;renderForm();}}

function softMissing(){
  let soft=[];
  if(formType==='LPC'){
    if(!String(state.userName||'').trim())soft.push('Nama pengguna');
    if(!String(state.address||'').trim())soft.push('Alamat pengguna');
    if(!state.cts.some(c=>String(c.value||'').trim()))soft.push('Nisbah CT');
    if(!String(state.supplierBill||'').trim())soft.push('Bil. pembekal');
    if(!String(state.tariff||'').trim())soft.push('Tarif');
  }else{
    if(!String(state.projectNo||'').trim())soft.push('No. projek');
    if(!String(state.project||'').trim())soft.push('Projek');
    if(!String(state.md||'').trim())soft.push('MD');
    if(!String(state.userType||'').trim())soft.push('Jenis pengguna');
  }
  return soft;
}

let pads={};
function initSignaturePads(){pads={};makePad('sigTnb','tnbSig');makePad('sigContractor','contractorSig');}
function makePad(id,key){
  let c=document.getElementById(id);if(!c)return;
  c.style.touchAction='none';
  let ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b1b45';
  if(state[key]){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=state[key];}
  let drawing=false;
  const xy=(clientX,clientY)=>{let r=c.getBoundingClientRect();return {x:(clientX-r.left)*c.width/r.width,y:(clientY-r.top)*c.height/r.height}};
  const start=(x,y)=>{drawing=true;let p=xy(x,y);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const move=(x,y)=>{if(!drawing)return;let p=xy(x,y);ctx.lineTo(p.x,p.y);ctx.stroke();};
  const finish=()=>{if(!drawing)return;drawing=false;state[key]=c.toDataURL('image/png');let s=document.getElementById(id+'Status');if(s)s.textContent='✓ Tandatangan direkodkan';scheduleSave();};
  c.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY);});
  c.addEventListener('mousemove',e=>{if(drawing){e.preventDefault();move(e.clientX,e.clientY);}});
  window.addEventListener('mouseup',finish);
  c.addEventListener('mouseleave',e=>{if(drawing&&!(e.buttons&1))finish();});
  c.addEventListener('touchstart',e=>{e.preventDefault();let t=e.touches[0];if(t)start(t.clientX,t.clientY);},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];if(t)move(t.clientX,t.clientY);},{passive:false});
  c.addEventListener('touchend',e=>{e.preventDefault();finish();},{passive:false});
  c.addEventListener('touchcancel',finish,{passive:false});
  pads[id]={c,ctx,key};
}
function clearPad(id,key){let p=pads[id];if(p)p.ctx.clearRect(0,0,p.c.width,p.c.height);state[key]=null;let s=document.getElementById(id+'Status');if(s)s.textContent='';scheduleSave();}

function ensurePdfLib(){
  return new Promise(function(resolve,reject){
    if(window.jspdf && window.jspdf.jsPDF) return resolve(true);
    var existing=document.getElementById("pdf-engine-script");
    if(existing){
      existing.addEventListener("load",function(){resolve(!!(window.jspdf&&window.jspdf.jsPDF));},{once:true});
      existing.addEventListener("error",function(){reject(new Error("PDF engine load failed"));},{once:true});
      return;
    }
    var s=document.createElement("script");
    s.id="pdf-engine-script";
    s.src="vendor.js?v=1190";
    s.onload=function(){resolve(!!(window.jspdf&&window.jspdf.jsPDF));};
    s.onerror=function(){reject(new Error("PDF engine load failed"));};
    document.head.appendChild(s);
  });
}

let lastPdf={url:null,blob:null,filename:'',driveOk:false,type:''};
async function finalise(){
  try{
    var pdfOk=await ensurePdfLib();
    if(!pdfOk)throw new Error('PDF engine unavailable');
  }catch(e){
    await appNotice('PDF tidak dapat dijana','Enjin PDF tidak dapat dimuatkan. Pastikan fail vendor.js ada dalam deployment MeterCheck. Cuba refresh app selepas deployment baharu.');
    return;
  }
  if(!state.tnbSig){await appNotice('Tandatangan diperlukan','Sila tandatangan sebagai Wakil TNB sebelum menjana PDF.');return;}
  if(!state.gps){await appNotice('GPS diperlukan','Rekodkan GPS atau masukkan koordinat secara manual sebelum pengesahan.');return;}
  let missingItems=state.rows.map((r,i)=>r.status?null:i+1).filter(Boolean);
  if(missingItems.length){await appNotice('Senarai Semak belum lengkap','Item belum dijawab: '+missingItems.join(', '));return;}
  if(formType==='OPC')state.result=computeOpcResult();
  if(state.useStamp&&!profile.stamp){await appNotice('Cop rasmi belum disimpan','Simpan cop dalam Profil (muat naik gambar atau jana daripada teks), atau nyahpilih penggunaan cop pada PDF.');return;}
  let soft=softMissing();
  if(soft.length){
    let go=await appConfirm('Maklumat belum lengkap','Medan berikut masih kosong:\\n'+soft.join(', ')+'\\n\\nAnda masih boleh jana PDF jika maklumat ini memang tidak diperlukan.','Jana PDF');
    if(!go)return;
  }
  let currentType=formType,doc=formType==='LPC'?pdfLpc():pdfOpc();
  appendPhotos(doc);
  let blob=doc.output('blob'),filename=state.ref.replace(/-/g,'_')+'.pdf';
  downloadBlob(blob,filename);
  let drive={ok:false,status:'local'};
  commitRef(formType,state.date);saveFinalRecord(filename);await idbDel(draftKey());
  if(lastPdf.url)URL.revokeObjectURL(lastPdf.url);
  lastPdf={url:URL.createObjectURL(blob),blob,filename,driveOk:drive.ok,driveStatus:drive.status,type:currentType};
  showCompletion(drive);
}
function showCompletion(drive){
  drive=drive||{ok:false,status:'not-configured'};
  let driveState='Belum dikonfigurasi';
  if(drive.status==='confirmed')driveState='Sandaran disahkan';
  else if(drive.status==='sent')driveState='Dihantar ke Google Drive';
  else if(drive.status==='offline')driveState='Menunggu internet';
  else if(drive.status==='pending')driveState='Sedang menunggu';
  else if(profile.driveUrl)driveState='Belum selesai';

  app.innerHTML=`<div class="shell">${appHeader('Pemeriksaan Selesai',lastPdf.filename)}<div class="page"><div class="completion">
    <div class="complete-icon">${ico('check',30)}</div><h1>Pemeriksaan selesai</h1><p>PDF rasmi berjaya dijana.</p>
    <div class="save-status">
      <div class="save-row"><span class="inline-icon">${ico('phone',17)}</span><span>Muat turun PDF</span><small>Dimulakan</small></div>
    </div>
    <div class="actions" style="max-width:430px;margin:0 auto 10px"><button class="btn secondary" onclick="openLastPdf()">${ico('file',16)} Lihat PDF</button><button class="btn ghost" onclick="shareLastPdf()">${ico('share',16)} Kongsi</button></div>
    <div style="height:10px"></div><button class="btn primary" style="width:min(430px,100%)" onclick="startForm(lastPdf.type)">${ico('plus',16)} Pemeriksaan baharu</button>
  </div></div></div>`;
}
function openLastPdf(){if(lastPdf.url)window.open(lastPdf.url,'_blank');}
async function shareLastPdf(){try{let f=new File([lastPdf.blob],lastPdf.filename,{type:'application/pdf'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))await navigator.share({title:lastPdf.filename,files:[f]});else downloadBlob(lastPdf.blob,lastPdf.filename);}catch(e){if(e.name!=='AbortError')downloadBlob(lastPdf.blob,lastPdf.filename);}}

function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}

function fitImg(doc,data,x,y,maxW,maxH){try{let p=doc.getImageProperties(data),r=p.width/p.height,w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r}doc.addImage(data,'PNG',x+(maxW-w)/2,y,w,h);}catch(e){}}
function pdfHeader(doc,title,sub){let W=215.9;try{doc.addImage(LOGO_DATA,'PNG',15,7,34,18);}catch(e){}doc.setFont('helvetica','bold').setFontSize(11);doc.text(title,W/2,12,{align:'center'});doc.setFont('helvetica','normal').setFontSize(7);if(sub)doc.text(sub,W/2,17,{align:'center'});return 23;}
function officialDate(v){if(!v)return '';let a=String(v).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v;}
function pxmm(v){return v*0.127;}
function putText(doc,text,x,y,size=7,maxW=0,align='left'){if(text==null||text==='')return;doc.setFont('helvetica','normal').setFontSize(size);let s=String(text);if(maxW){let lines=doc.splitTextToSize(s,maxW);doc.text(lines,x,y,{align});}else doc.text(s,x,y,{align});}
function putBold(doc,text,x,y,size=7){if(!text)return;doc.setFont('helvetica','bold').setFontSize(size);doc.text(String(text),x,y);doc.setFont('helvetica','normal');}
function drawCheck(doc,cx,cy,s=1.35){doc.setLineWidth(.28);doc.line(cx-s*.75,cy,cx-s*.18,cy+s*.55);doc.line(cx-s*.18,cy+s*.55,cx+s,cy-s*.7);doc.setLineWidth(.2);}
function sourceUnderline(doc,x1,x2,y){doc.setLineWidth(.32);doc.line(pxmm(x1),pxmm(y),pxmm(x2),pxmm(y));doc.setLineWidth(.2);}
function putCenteredFit(doc,text,cx,y,w,size=5.3,min=4.3){if(text==null||text==='')return;let s=String(text),fs=size;doc.setFont('helvetica','normal');while(fs>min){doc.setFontSize(fs);if(doc.getTextWidth(s)<=w)break;fs-=.2;}doc.text(s,cx,y,{align:'center'});}
function fitImgBottom(doc,data,x,bottom,maxW,maxH){try{let p=doc.getImageProperties(data),r=p.width/p.height,w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r}doc.addImage(data,'PNG',x+(maxW-w)/2,bottom-h,w,h);}catch(e){}}
function addOfficialBg(doc,data){doc.addImage(data,'PNG',0,0,215.9,279.4);}
function fitTextIn(doc,text,x,y,w,size=7,min=5.2){if(text==null||text==='')return;let s=String(text),fs=size;doc.setFont('helvetica','normal');while(fs>min){doc.setFontSize(fs);if(doc.getTextWidth(s)<=w)break;fs-=.25;}doc.text(s,x,y);}
function relabelLpc(doc,text,x,y,w=250,size=6.4){doc.setFillColor(255,255,255);doc.rect(pxmm(x-8),pxmm(y-28),pxmm(w),pxmm(36),'F');doc.setTextColor(0);doc.setFont('helvetica','normal').setFontSize(size);doc.text(String(text),pxmm(x),pxmm(y));}
function pdfLpc(){const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'letter',orientation:'portrait'});addOfficialBg(doc,LPC_TEMPLATE_DATA);let ct=state.cts.map(x=>(x.value||'').trim()).filter(Boolean).join(', '),gps=state.gps?(state.gps.lat.toFixed(6)+', '+state.gps.lng.toFixed(6)):'';
  // Standardise the small source labels in the LPC information block so the form reads cleanly at one visual size.
  relabelLpc(doc,'Nama Stesen',350,364,250,6.4);
  relabelLpc(doc,'Kod Stesen',350,408,250,6.4);
  relabelLpc(doc,'Nisbah Alatubah Arus',350,452,250,6.4);
  relabelLpc(doc,'GPS Coordinate',350,502,250,6.4);
  // Main LPC values use one consistent base size; shrink only when a long value genuinely needs it.
  fitTextIn(doc,state.station,pxmm(632),pxmm(364),18,7.2,5.9);fitTextIn(doc,state.supplierBill,pxmm(1450),pxmm(364),13,7.2,5.9);
  fitTextIn(doc,state.stationCode,pxmm(632),pxmm(408),18,7.2,5.9);fitTextIn(doc,state.tariff,pxmm(1450),pxmm(408),13,7.2,5.9);
  fitTextIn(doc,ct,pxmm(632),pxmm(452),45,7.2,5.8);fitTextIn(doc,state.voltage,pxmm(1450),pxmm(452),13,7.2,5.9);
  fitTextIn(doc,gps,pxmm(632),pxmm(502),47,7.0,5.7);
  fitTextIn(doc,state.userName,pxmm(350),pxmm(579),88,7.2,5.9);
  putText(doc,state.address,pxmm(350),pxmm(641),7.0,95);
  // Readiness column: compact tick centred in the original readiness cell.
  const rowPix=[[802,879],[879,974],[974,1062],[1062,1138],[1138,1246],[1246,1381],[1381,1483]];
  state.rows.forEach((r,i)=>{let cy=pxmm((rowPix[i][0]+rowPix[i][1])/2);let ready=!!r.status && !/Tidak Sedia|Tiada Kaitan/i.test(r.status);if(ready)drawCheck(doc,pxmm(1296),cy,1.45);});
  // Ulasan: print ONLY the explicit general remark entered in the Ulasan field.
  // Checklist status/item notes are already represented in the inspection section and must not be duplicated here.
  let generalRemark=(state.remarks||'').trim();
  if(generalRemark){
    let size=5.8, lines=[];
    while(size>=4.8){
      doc.setFont('helvetica','normal').setFontSize(size);
      lines=doc.splitTextToSize(generalRemark,142);
      if(lines.length<=4)break;
      size-=0.2;
    }
    const remarkY=[1569,1603,1636,1670];
    lines.slice(0,4).forEach((line,i)=>doc.text(line,pxmm(395),pxmm(remarkY[i])));
  }

async function backupBlob(blob,filename,meta){
  if(!profile.driveUrl)return {ok:false,status:'not-configured'};

  let b64='';
  try{
    const dataUrl=await blobToBase64(blob);
    b64=(dataUrl.split(',')[1]||'');
  }catch(e){
    console.warn('Base64 failed',e);
    return {ok:false,status:'encode-failed'};
  }

  return new Promise(resolve=>{
    const requestId='mc_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
    const frameName='mcDriveFrame_'+requestId;
    let done=false;

    const iframe=document.createElement('iframe');
    iframe.name=frameName;
    iframe.style.display='none';
    iframe.setAttribute('aria-hidden','true');

    const form=document.createElement('form');
    form.method='POST';
    form.action=profile.driveUrl;
    form.target=frameName;
    form.enctype='application/x-www-form-urlencoded';
    form.style.display='none';

    const fields={
      mode:'metercheck-form',
      key:profile.driveKey||'',
      filename:filename,
      pdfBase64:b64,
      meta:JSON.stringify(meta||{}),
      requestId:requestId
    };

    Object.entries(fields).forEach(([name,value])=>{
      const input=document.createElement('input');
      input.type='hidden';
      input.name=name;
      input.value=value;
      form.appendChild(input);
    });

    const cleanup=()=>{
      window.removeEventListener('message',onMessage);
      clearTimeout(timer);
      setTimeout(()=>{try{form.remove();iframe.remove();}catch(e){}},300);
    };

    const finish=result=>{
      if(done)return;
      done=true;
      cleanup();
      resolve(result);
    };

    const onMessage=ev=>{
      const d=ev.data;
      if(!d||d.type!=='metercheck-drive'||d.requestId!==requestId)return;
      if(d.ok){
        finish({ok:true,status:'confirmed',fileId:d.fileId||'',fileUrl:d.fileUrl||''});
      }else{
        finish({ok:false,status:'server-rejected',error:d.error||'Upload rejected'});
      }
    };

    window.addEventListener('message',onMessage);
    document.body.appendChild(iframe);
    document.body.appendChild(form);

    // If Apps Script cannot return a readable iframe acknowledgement,
    // still record that the browser submitted the cross-origin form.
    const timer=setTimeout(()=>{
      finish({ok:true,status:'sent'});
    },20000);

    try{
      form.submit();
    }catch(e){
      console.warn('Drive form submit failed',e);
      finish({ok:false,status:'submit-failed'});
    }
  });
}
function blobToBase64(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
async function retryPending(silent=false){
  let p=await idbGet('pendingBackup');
  if(!p){if(!silent)showHome();return false;}
  if(!navigator.onLine){if(!silent)await appNotice('Tiada internet','PDF kekal dalam queue dan akan dicuba semula apabila sambungan kembali.');return false;}
  if(!silent)toast('Mencuba sandaran...');
  let r=await backupBlob(p.blob,p.filename,p.meta);
  if(r.ok&&r.status==='confirmed'){
    await idbDel('pendingBackup');
    if(!silent)await appNotice('Sandaran selesai','Google Drive mengesahkan PDF berjaya disimpan.');
  }else if(r.ok&&r.status==='sent'){
    if(!silent)await appNotice('Dihantar ke Google Drive','PDF telah dihantar melalui sambungan Google Drive. Semak folder Drive jika pengesahan automatik belum diterima.');
  }else if(!silent){
    await appNotice('Sandaran gagal','Semak Web App URL /exec, Upload Key dan tetapan akses deployment Google Apps Script.');
  }
  if(!silent)showHome();
  return r.ok;
}

function makeTextStamp(lines){
  const c=document.createElement('canvas'),ctx=c.getContext('2d'),blue='#1f3fa0';
  let fs=46;ctx.font='bold '+fs+'px Arial, Helvetica, sans-serif';
  const widest=()=>Math.max(...lines.map(l=>ctx.measureText(l).width));
  while(fs>22&&widest()>820){fs-=2;ctx.font='bold '+fs+'px Arial, Helvetica, sans-serif';}
  const lh=Math.round(fs*1.28),padX=34,padY=26,w=Math.ceil(widest())+padX*2,h=lines.length*lh+padY*2;
  c.width=w+8;c.height=h+8;
  ctx.font='bold '+fs+'px Arial, Helvetica, sans-serif';ctx.strokeStyle=blue;ctx.fillStyle=blue;ctx.lineWidth=5;
  ctx.strokeRect(4,4,w,h);ctx.textAlign='center';ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l,4+w/2,4+padY+lh*i+lh/2));
  return c.toDataURL('image/png');
}

function compressPng(file,max){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/png'));};im.onerror=reject;im.src=r.result;};r.readAsDataURL(file);});}

const FALLBACK_PREFIX="tnb_mobile_store_";
function fallbackSet(k,v){
  // Blob cannot be safely persisted in localStorage; skip queued PDF blob fallback.
  if(k==="pendingBackup" && v && v.blob instanceof Blob) return;
  safeSet(FALLBACK_PREFIX+k,JSON.stringify(v));
}
function fallbackGet(k){
  try{ const x=safeGet(FALLBACK_PREFIX+k); return x?JSON.parse(x):null; }catch(e){ return null; }
}
function fallbackDel(k){ safeRemove(FALLBACK_PREFIX+k); }

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("IndexedDB unavailable"));
    let done=false;
    const timer=setTimeout(()=>{ if(!done){done=true;rej(new Error("IndexedDB timeout"));}},1200);
    let r;
    try{ r=indexedDB.open("tnb_digital_inspection",1); }catch(e){ clearTimeout(timer); return rej(e); }
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess=()=>{ if(done){try{r.result.close()}catch(e){};return;} done=true;clearTimeout(timer);res(r.result); };
    r.onerror=()=>{ if(done)return; done=true;clearTimeout(timer);rej(r.error||new Error("IndexedDB error")); };
    r.onblocked=()=>{ if(done)return; done=true;clearTimeout(timer);rej(new Error("IndexedDB blocked")); };
  });
}
async function idbSet(k,v){
  try{
    let db=await idbOpen();
    await new Promise((res,rej)=>{
      let tx=db.transaction("kv","readwrite");
      tx.objectStore("kv").put(v,k);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
      tx.onabort=()=>rej(tx.error||new Error("IDB aborted"));
    });
    try{db.close()}catch(e){}
    return true;
  }catch(e){ fallbackSet(k,v); return false; }
}
async function idbGet(k){
  try{
    let db=await idbOpen();
    let val=await new Promise((res,rej)=>{
      let r=db.transaction("kv").objectStore("kv").get(k);
      r.onsuccess=()=>res((r.result==null?null:r.result));
      r.onerror=()=>rej(r.error);
    });
    try{db.close()}catch(e){}
    return val;
  }catch(e){ return fallbackGet(k); }
}
async function idbDel(k){
  fallbackDel(k);
  try{
    let db=await idbOpen();
    await new Promise((res,rej)=>{
      let tx=db.transaction("kv","readwrite");
      tx.objectStore("kv").delete(k);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
    });
    try{db.close()}catch(e){}
  }catch(e){}
}
